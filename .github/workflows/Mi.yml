name: Fix Mi File Manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'mi.apk' --clobber
      - name: Patch and build
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar apktool.jar d -f mi.apk -o work
          python3 - <<'EOF'
          import re, pathlib
          m = pathlib.Path('work/AndroidManifest.xml')
          x = m.read_text(encoding='utf-8')
          x2 = re.sub(r'(<uses-library\s+android:name="micloud-sdk")(\s*/>)', r'\1 android:required="false"\2', x)
          print("patched" if x2 != x else "NOT PATCHED")
          m.write_text(x2, encoding='utf-8')
          EOF
          java -jar apktool.jar b work -o unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore my.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Local"
          mkdir -p out
          $BT/apksigner sign --ks my.jks --ks-pass pass:android --key-pass pass:android \
            --out out/MiFileManager_fixed.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mi_fixed
          path: out/MiFileManager_fixed.apk
