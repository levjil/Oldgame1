name: Rebuild APKs for Android 16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download big APKs from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'Sea.apk' --dir . --clobber || echo "no release assets"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write patch script
        run: |
          cat > patch.py <<'EOF'
          import re, sys, pathlib
          d = pathlib.Path(sys.argv[1])
          mode = sys.argv[2]
          if mode == 'sdk':
              p = d / 'apktool.yml'
              s = p.read_text(encoding='utf-8')
              if 'sdkInfo:' not in s:
                  s += "\nsdkInfo:\n  minSdkVersion: '21'\n  targetSdkVersion: '28'\n"
              else:
                  if re.search(r'minSdkVersion:', s):
                      s = re.sub(r"minSdkVersion:.*", "minSdkVersion: '21'", s)
                  else:
                      s = s.replace('sdkInfo:', "sdkInfo:\n  minSdkVersion: '21'", 1)
                  if re.search(r'targetSdkVersion:', s):
                      s = re.sub(r"targetSdkVersion:.*", "targetSdkVersion: '28'", s)
                  else:
                      s = s.replace('sdkInfo:', "sdkInfo:\n  targetSdkVersion: '28'", 1)
              p.write_text(s, encoding='utf-8')
              m = d / 'AndroidManifest.xml'
              x = m.read_text(encoding='utf-8')
              x = x.replace('android:anyDensity="false"', 'android:anyDensity="true"')
              x = re.sub(r'android:(smallScreens|normalScreens|largeScreens|xlargeScreens)="false"', r'android:\1="true"', x)
              if '<supports-screens' in x and 'xlargeScreens' not in x:
                  x = x.replace('<supports-screens', '<supports-screens android:xlargeScreens="true"', 1)
              m.write_text(x, encoding='utf-8')
          else:
              m = d / 'AndroidManifest.xml'
              x = m.read_text(encoding='utf-8')
              pkg = re.search(r'package="([^"]+)"', x).group(1)
              app = re.search(r'<application\b[^>]*>', x).group(0)
              nm = re.search(r'android:name="([^"]+)"', app)
              if nm:
                  name = nm.group(1)
                  if name.startswith('.'):
                      name = pkg + name
                  elif '.' not in name:
                      name = pkg + '.' + name
                  sup = 'L' + name.replace('.', '/') + ';'
                  newapp = app.replace(nm.group(0), 'android:name="strictfix.Fix"', 1)
              else:
                  sup = 'Landroid/app/Application;'
                  newapp = app.replace('<application', '<application android:name="strictfix.Fix"', 1)
              x = x.replace(app, newapp, 1)
              m.write_text(x, encoding='utf-8')
              out = d / 'smali' / 'strictfix'
              out.mkdir(parents=True, exist_ok=True)
              (out / 'Fix.smali').write_text(f""".class public Lstrictfix/Fix;
          .super {sup}

          .method public constructor <init>()V
              .locals 0
              invoke-direct {{p0}}, {sup}-><init>()V
              return-void
          .end method

          .method public onCreate()V
              .locals 2
              new-instance v0, Landroid/os/StrictMode$ThreadPolicy$Builder;
