name: Rebuild APK for Android 16

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download apktool
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Decode original APK
        run: java -jar apktool.jar d -f game.apk -o decoded

      - name: Patch SDK versions
        run: |
          python3 - <<'EOF'
          import re
          p = 'decoded/apktool.yml'
          s = open(p, encoding='utf-8').read()
          if 'sdkInfo:' not in s:
              s += "\nsdkInfo:\n  minSdkVersion: '21'\n  targetSdkVersion: '28'\n"
          else:
              if re.search(r'minSdkVersion:', s):
                  s = re.sub(r"minSdkVersion:.*", "minSdkVersion: '21'", s)
              else:
                  s = s.replace('sdkInfo:', "sdkInfo:\n  minSdkVersion: '21'", 1)
              if re.search(r'targetSdkVersion:', s):
                  s = re.sub(r"targetSdkVersion:.*", "targetSdkVersion: '28'", s)
              else:
                  s = s.replace('sdkInfo:', "sdkInfo:\n  targetSdkVersion: '28'", 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          EOF

      - name: Build APK
        run: java -jar apktool.jar b decoded -o unsigned.apk

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore my.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Local"
          $BT/apksigner sign --ks my.jks --ks-pass pass:android --key-pass pass:android \
            --out game_fixed.apk aligned.apk
          $BT/apksigner verify game_fixed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: game_fixed
          path: game_fixed.apk
