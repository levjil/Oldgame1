name: Rebuild APKs for Android 16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download big APKs from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'Sea.apk' --dir . --clobber || echo "no release assets"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write patch script
        run: |
          cat > patch.py <<'EOF'
          import re, sys, pathlib
          d = pathlib.Path(sys.argv[1])
          p = d / 'apktool.yml'
          s = p.read_text(encoding='utf-8')
          t = re.search(r"targetSdkVersion: '?(\d+)", s)
          if t and int(t.group(1)) >= 28:
              print('modern app, skipping')
              sys.exit(0)
          if 'sdkInfo:' not in s:
              s += "\nsdkInfo:\n"
          s = re.sub(r"\n\s*minSdkVersion:.*", "", s)
          s = re.sub(r"\n\s*targetSdkVersion:.*", "", s)
          s = s.replace('sdkInfo:', "sdkInfo:\n  minSdkVersion: '21'\n  targetSdkVersion: '28'", 1)
          p.write_text(s, encoding='utf-8')
          m = d / 'AndroidManifest.xml'
          x = m.read_text(encoding='utf-8')
          x = x.replace('android:anyDensity="false"', 'android:anyDensity="true"')
          x = re.sub(r'android:(small|normal|large|xlarge)Screens="false"', r'android:\1Screens="true"', x)
          m.write_text(x, encoding='utf-8')
          EOF

      - name: Build all APKs
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore my.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Local"
          mkdir -p out
          for f in *.apk; do
            n=$(basename "$f" .apk)
            echo "=== $n"
            rm -rf "w_$n"
            java -jar apktool.jar d -f "$f" -o "w_$n" || { echo "DECODE FAILED: $n"; continue; }
            python3 patch.py "w_$n"
            java -jar apktool.jar b "w_$n" -o "u_$n.apk" || { echo "BUILD FAILED: $n"; continue; }
            $BT/zipalign -f -p 4 "u_$n.apk" "a_$n.apk"
            $BT/apksigner sign --ks my.jks --ks-pass pass:android --key-pass pass:android \
              --out "out/${n}_fixed.apk" "a_$n.apk"
            echo "OK: $n"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: fixed_apks
          path: out/*.apk
