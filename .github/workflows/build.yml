name: Rebuild APKs for Android 16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write patch script
        run: |
          cat > patch.py <<'EOF'
          import re, sys, pathlib
          d = pathlib.Path(sys.argv[1])
          p = d / 'apktool.yml'
          s = p.read_text(encoding='utf-8')
          if 'sdkInfo:' not in s:
              s += "\nsdkInfo:\n  minSdkVersion: '21'\n  targetSdkVersion: '28'\n"
          else:
              if re.search(r'minSdkVersion:', s):
                  s = re.sub(r"minSdkVersion:.*", "minSdkVersion: '21'", s)
              else:
                  s = s.replace('sdkInfo:', "sdkInfo:\n  minSdkVersion: '21'", 1)
              if re.search(r'targetSdkVersion:', s):
                  s = re.sub(r"targetSdkVersion:.*", "targetSdkVersion: '28'", s)
              else:
                  s = s.replace('sdkInfo:', "sdkInfo:\n  targetSdkVersion: '28'", 1)
          p.write_text(s, encoding='utf-8')
          m = d / 'AndroidManifest.xml'
          x = m.read_text(encoding='utf-8')
          x = x.replace('android:anyDensity="false"', 'android:anyDensity="true"')
          m.write_text(x, encoding='utf-8')
          EOF

      - name: Build all APKs
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore my.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Local"
          mkdir -p out
          for f in *.apk; do
            n=$(basename "$f" .apk)
            echo "=== $n"
            rm -rf "work_$n"
            java -jar apktool.jar d -f "$f" -o "work_$n" || { echo "DECODE FAILED: $n"; continue; }
            python3 patch.py "work_$n"
            java -jar apktool.jar b "work_$n" -o "u_$n.apk" || { echo "BUILD FAILED: $n"; continue; }
            $BT/zipalign -f -p 4 "u_$n.apk" "a_$n.apk"
            $BT/apksigner sign --ks my.jks --ks-pass pass:android --key-pass pass:android \
              --out "out/${n}_fixed.apk" "a_$n.apk"
            echo "OK: $n"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: fixed_apks
          path: out/*.apk
